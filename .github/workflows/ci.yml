name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: [self-hosted, dedibox]
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: echo "::notice::$(. /etc/os-release; echo $PRETTY_NAME); $(cmake --version | head -1); ninja $(ninja --version); $(g++ --version | head -1); $(clang++ --version | head -1); $(ccache --version | head -1)"

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          CC: ${{ matrix.compiler == 'clang++' && 'clang' || 'gcc' }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DINKAMATH_WERROR=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Its log is out of reach of who reads the run through the API.
      - name: Report a failed configure
        if: failure()
        run: cmake -S . -B build -G Ninja 2>&1 | grep -A3 -i "error" | head -20 | sed 's/^/::error::/'

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Report failed tests
        if: failure()
        run: |
          f=build/Testing/Temporary
          sed 's/^/::error::failed /' $f/LastTestsFailed.log 2>/dev/null || true
          grep -E "^[0-9]+/[0-9]+ Test|Test time" $f/LastTest.log 2>/dev/null | grep -iE "fail|timeout|Test time" | head -20 | sed 's/^/::error::/' || true

  windows:
    name: msvc / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Debug for MSVC's checked iterators, the counterpart of the
        # _GLIBCXX_ASSERTIONS the sanitizer job builds with.
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DINKAMATH_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: asan+ubsan
    # The dedibox's cores take the interpreter suite past its 60 s under the
    # sanitizers; hosted until the suite is split.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DINKAMATH_SANITIZE=address,undefined
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Report failed tests
        if: failure()
        run: |
          f=build/Testing/Temporary
          sed 's/^/::error::failed /' $f/LastTestsFailed.log 2>/dev/null || true
          grep -E "^[0-9]+/[0-9]+ Test|Test time" $f/LastTest.log 2>/dev/null | grep -iE "fail|timeout|Test time" | head -20 | sed 's/^/::error::/' || true

  format:
    name: clang-format
    runs-on: [self-hosted, dedibox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the lines this branch touched are checked. The 2014 sources are
      # deliberately not reformatted wholesale -- see CLAUDE.md.
      - name: Check formatting of changed lines
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against; skipping."
            exit 0
          fi
          diff=$(git clang-format --diff "$base" -- '*.hpp' '*.cpp' || true)
          case "$diff" in
            ""|*"no modified files"*|*"did not modify"*) echo "Formatting OK." ;;
            *) echo "$diff"; echo "::error::Run: git clang-format $base"; exit 1 ;;
          esac
