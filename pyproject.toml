# 'pip install -e .' makes 'import inkamath' work: tools/inkamath.py, the
# standard library alone (docs/compile.md, Hosting).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkamath"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
only-include = ["tools/inkamath.py"]
sources = ["tools"]
